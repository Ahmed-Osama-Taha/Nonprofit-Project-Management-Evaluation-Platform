global:
  scrape_interval: 15s

scrape_configs:
  - job_name: backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # RabbitMQ 3-management ships the prometheus plugin on :15692.
  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]
