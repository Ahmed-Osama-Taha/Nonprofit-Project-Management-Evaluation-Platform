services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nppm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nppm}
      POSTGRES_DB: ${POSTGRES_DB:-nppm}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nppm} -d ${POSTGRES_DB:-nppm}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Antivirus daemon (clamd). Scans every uploaded document over INSTREAM.
  # First boot downloads virus definitions via freshclam (can take a couple of
  # minutes); uploads fail closed (503) until it's ready, then self-heal.
  clamav:
    image: clamav/clamav:latest
    ports:
      - "3310:3310"
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  # Message broker for async AI analysis (dramatiq). Management UI on :15672.
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    # Shared image: worker builds the same context, so tag once and reuse — the
    # image (torch + model) is built and stored a single time, not per service.
    image: athar-backend:local
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
      clamav:
        condition: service_started
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://nppm:nppm@db:5432/nppm}
      SECRET_KEY: ${SECRET_KEY:-dev-super-secret-change-me}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      # Antivirus — clamd host for upload scanning (fail-closed when set).
      CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      # Rate limiting (Redis-backed; no-op without Redis).
      RATE_LIMIT_IP_MAX: ${RATE_LIMIT_IP_MAX:-300}
      RATE_LIMIT_TENANT_MAX: ${RATE_LIMIT_TENANT_MAX:-600}
      # Auth cookies — httpOnly session token (XSS-safe). Set COOKIE_SECURE=true
      # behind HTTPS in production.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      # Redis — JWT denylist (revocation) + caching.
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      # RabbitMQ — enqueue AI analysis to the dramatiq worker.
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
      # Observability — enabled via docker-compose.observability.yml.
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-athar-backend}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-nppm-documents}
      S3_REGION: ${S3_REGION:-us-east-1}
      AUDIT_TO_S3: ${AUDIT_TO_S3:-true}
      DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:-SAR}
      # AI — Anthropic Claude is the default LLM provider. Set ANTHROPIC_API_KEY
      # in your .env to enable AI features (the platform runs fully without it).
      AI_PROVIDER: ${AI_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5}
      # Embeddings are pluggable; "local" needs no external key (works with only Claude).
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-st}
      AI_ST_MODEL: ${AI_ST_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      AI_EMBEDDING_DIM: ${AI_EMBEDDING_DIM:-384}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-gpt-4o-mini}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-text-embedding-3-small}
      SEED_ON_STARTUP: ${SEED_ON_STARTUP:-true}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@demo.org}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin123!}
      SEED_REVIEWER_EMAIL: ${SEED_REVIEWER_EMAIL:-reviewer@demo.org}
      SEED_REVIEWER_PASSWORD: ${SEED_REVIEWER_PASSWORD:-Reviewer123!}
      SEED_ORG_EMAIL: ${SEED_ORG_EMAIL:-org@demo.org}
      SEED_ORG_PASSWORD: ${SEED_ORG_PASSWORD:-Org123!}
    ports:
      - "8000:8000"

  # dramatiq worker — runs AI analysis off the request path (same codebase).
  # Reuses the backend image (same build context) so it isn't built/stored twice.
  worker:
    build: ./backend
    image: athar-backend:local
    command: ["dramatiq", "app.tasks", "-p", "2", "-t", "2"]
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      minio:
        condition: service_started
      redis:
        condition: service_started
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://nppm:nppm@db:5432/nppm}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-nppm-documents}
      S3_REGION: ${S3_REGION:-us-east-1}
      AUDIT_TO_S3: ${AUDIT_TO_S3:-true}
      AI_PROVIDER: ${AI_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-st}
      AI_ST_MODEL: ${AI_ST_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      AI_EMBEDDING_DIM: ${AI_EMBEDDING_DIM:-384}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}

  # Lightweight web UI to browse/query PostgreSQL. Open http://localhost:8080
  # System: PostgreSQL · Server: db · User/Pass/DB: nppm (defaults).
  adminer:
    image: adminer:4
    depends_on:
      db:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DESIGN: dracula
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        # Empty = the browser calls the SAME origin (/api/*), which the Next
        # server proxies to the backend. This makes ngrok / reverse proxies work
        # with a single tunnel to port 3000 — no CORS, no mixed content.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL-}
        API_PROXY_TARGET: ${API_PROXY_TARGET:-http://backend:8000}
    depends_on:
      - backend
    environment:
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://backend:8000}
    ports:
      - "3000:3000"

volumes:
  postgres-data:
  minio-data:
  redis-data:
  clamav-data:
